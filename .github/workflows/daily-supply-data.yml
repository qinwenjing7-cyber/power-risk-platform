name: 每日供需数据生成

# 每天北京时间 23:30 运行 (UTC 15:30)
# 为什么选 23:30: 和风逐小时预报从"下一个整点"开始,
#   23:30 运行 → 首个数据为次日 00:00 → 可拿到次日完整24小时
on:
  schedule:
    - cron: '30 15 * * *'
  workflow_dispatch: # 支持手动触发 (用于测试)

# 需要写权限才能把生成的数据提交回仓库
permissions:
  contents: write

# 避免定时任务重叠执行
concurrency:
  group: daily-supply-data
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装依赖
        run: pip install cryptography

      - name: 生成供需数据
        env:
          # 私钥内容 (PEM 文本) —— 存于仓库 Secrets, 不落盘
          QWEATHER_PRIVATE_KEY: ${{ secrets.QWEATHER_PRIVATE_KEY }}
        run: python model/src/export_supply_demand.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/supply-demand-all.json
          if git diff --staged --quiet; then
            echo "数据无变化, 无需提交"
          else
            git commit -m "chore: 自动更新供需数据 ($(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M'))"
            git push
          fi
